  services:
    mysql:
      image: mysql:8
      container_name: energy-monitoring-db
      environment:
        MYSQL_DATABASE: energy_monitoring
        MYSQL_USER: user
        MYSQL_PASSWORD: password
        MYSQL_ROOT_PASSWORD: rootpass
      ports:
        - "3306:3306"
      volumes:
        - mysql_data:/var/lib/mysql

  volumes:
    mysql_data: